name: Regenerate release manifest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/regenerate_manifest.yml"

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import subprocess
          from pathlib import Path

          excluded = {
              "MANIFEST_SHA256.csv",
              ".github/workflows/regenerate_manifest.yml",
          }

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = sorted(
              p.decode("utf-8")
              for p in raw.split(b"\0")
              if p and p.decode("utf-8") not in excluded
          )

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          with Path("MANIFEST_SHA256.csv").open(
              "w", newline="", encoding="utf-8"
          ) as handle:
              writer = csv.writer(handle)
              writer.writerow(["sha256", "path"])
              for rel in paths:
                  writer.writerow([sha256(Path(rel)), rel])

          print(f"Manifest entries: {len(paths)}")
          PY

      - name: Verify manifest against working tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import subprocess
          from pathlib import Path

          manifest = Path("MANIFEST_SHA256.csv")
          excluded = {
              "MANIFEST_SHA256.csv",
              ".github/workflows/regenerate_manifest.yml",
          }

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          tracked = {
              p.decode("utf-8")
              for p in raw.split(b"\0")
              if p and p.decode("utf-8") not in excluded
          }

          with manifest.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          listed = {row["path"] for row in rows}
          if listed != tracked:
              missing = sorted(tracked - listed)
              stale = sorted(listed - tracked)
              raise RuntimeError(
                  f"Manifest/tree mismatch. Missing={missing}, stale={stale}"
              )

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          for row in rows:
              actual = sha256(Path(row["path"]))
              if actual != row["sha256"]:
                  raise RuntimeError(
                      f"SHA mismatch: {row['path']}"
                  )

          print(f"Verified {len(rows)} manifest entries")
          PY

      - name: Commit manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST_SHA256.csv
          if git diff --cached --quiet; then
            echo "Manifest already current"
            exit 0
          fi
          git commit -m "Regenerate release SHA-256 manifest"
          git push
